name: Mac tcl8 build and install

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        brew update
        brew install autoconf
        brew uninstall tcl-tk@8
        brew install tcl-tk@9
    - name: configure	
      run: |
        autoreconf -vi
        PREFIX=/opt/homebrew/opt/tcl-tk@9
        ./configure --with-tcl=$PREFIX/lib --prefix=$PREFIX
    - name: make
      run: make
    - name: install
      run: sudo make install
